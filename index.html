<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nazma birthday</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div id="tsparticles"></div>
    <div class="container" id="main-container">
        <div id="pre-birthday" class="content">
            <h1 id="adv-title" class="title fade-in">Adv Happy Birthday [Her Name]!</h1>
            <div class="countdown-container glow-effect fade-in-delayed">
                <div class="time-box">
                    <span id="days" class="number">00</span>
                    <span class="label">Days</span>
                </div>
                <div class="separator">:</div>
                <div class="time-box">
                    <span id="hours" class="number">00</span>
                    <span class="label">Hours</span>
                </div>
                <div class="separator">:</div>
                <div class="time-box">
                    <span id="minutes" class="number">00</span>
                    <span class="label">Minutes</span>
                </div>
                <div class="separator">:</div>
                <div class="time-box">
                    <span id="seconds" class="number">00</span>
                    <span class="label">Seconds</span>
                </div>
            </div>
            <p class="dev-note fade-in-delayed"><i class="fa-solid fa-code"></i> Note: This site is still under
                development. It will fully open on your (Nazma) birthday.</p>
                
            <button id="open-login-btn" class="glow-btn fade-in-delayed hidden" style="margin-top: -1rem;">
                <i class="fa-solid fa-unlock-keyhole"></i> Enter Code
            </button>
        </div>

        <div id="birthday-greeting" class="content hidden">
            <h1 class="birthday-title hero-glow"></h1>
        </div>
    </div>

    <!-- Login Modal -->
    <div id="login-modal" class="modal-overlay hidden">
        <div class="glow-effect login-box">
            <h2 style="color: white; margin-bottom: 1rem; font-weight: 300;">Secret Access</h2>
            <div class="input-group">
                <i class="fa-regular fa-user"></i>
                <input type="text" id="username" placeholder="Name" autocomplete="off" />
            </div>
            <div class="input-group">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="password" placeholder="Password" />
            </div>
            <button id="login-btn">Unlock</button>
            <p id="error-msg" class="error-msg hidden">Incorrect name or password.</p>
            <button id="close-modal-btn" class="close-btn"><i class="fa-solid fa-xmark"></i></button>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/tsparticles@2/tsparticles.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
